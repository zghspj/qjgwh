<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成员管理 · 后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #e8f5e9;
            display: flex;
            justify-content: center;
            padding: 30px 16px;
        }
        .panel {
            max-width: 720px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 8px 30px rgba(46, 125, 50, 0.15);
            border: 1px solid #a5d6a7;
        }
        h1 {
            font-size: 24px;
            color: #1b5e20;
            border-left: 6px solid #4caf50;
            padding-left: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #888;
        }
        .row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }
        .row label {
            font-size: 13px;
            font-weight: 600;
            color: #2e7d32;
        }
        .row input,
        .row select,
        .row textarea {
            padding: 10px 14px;
            border: 1px solid #c8e6c9;
            border-radius: 12px;
            font-size: 14px;
            background: #f9fbf9;
            font-family: inherit;
        }
        .row input:focus,
        .row select:focus,
        .row textarea:focus {
            border-color: #2e7d32;
            outline: none;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
        }
        .row textarea {
            resize: vertical;
            min-height: 60px;
        }
        .file-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .file-group input[type="file"] {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
        }
        .file-group .preview-box img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4caf50;
            background: #e8f5e9;
        }
        .file-group .preview-box .qr-preview {
            border-radius: 8px;
            width: 56px;
            height: 56px;
            border: 2px solid #4caf50;
            object-fit: contain;
            background: #fff;
        }
        .btn {
            padding: 12px 0;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: #2e7d32;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover {
            background: #1b5e20;
        }
        .btn.danger {
            background: #c62828;
        }
        .btn.danger:hover {
            background: #b71c1c;
        }
        .btn.outline {
            background: transparent;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }
        .btn.outline:hover {
            background: #2e7d32;
            color: #fff;
        }
        .btn-sm {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: #2e7d32;
            cursor: pointer;
        }
        .btn-sm.danger {
            background: #c62828;
        }
        .btn-sm.warning {
            background: #f57c00;
        }
        .btn-sm.warning:hover {
            background: #e65100;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-group .btn {
            flex: 1;
        }

        /* ===== 成员列表 - 可滚动 ===== */
        .member-list-wrap {
            margin-top: 20px;
            border-top: 1px solid #e0e0e0;
            padding-top: 16px;
        }
        .member-list-wrap .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .member-list-wrap .list-header .count {
            font-size: 13px;
            color: #888;
        }
        .member-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .member-list::-webkit-scrollbar {
            width: 6px;
        }
        .member-list::-webkit-scrollbar-track {
            background: #f1f8e9;
            border-radius: 8px;
        }
        .member-list::-webkit-scrollbar-thumb {
            background: #a5d6a7;
            border-radius: 8px;
        }
        .member-list::-webkit-scrollbar-thumb:hover {
            background: #81c784;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #f1f8e9;
            border-radius: 14px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
            transition: 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .member-item:hover {
            background: #e8f5e9;
            border-color: #c8e6c9;
        }
        .member-item.editing {
            border-color: #c9a84c;
            background: #fff8e1;
        }
        .member-item .info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
        }
        .member-item .info .thumb {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #a5d6a7;
            background: #c8e6c9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #2e7d32;
            font-size: 14px;
            flex-shrink: 0;
        }
        .member-item .info .name-id {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }
        .member-item .info .name-id .name {
            font-weight: 600;
            color: #1b5e20;
            font-size: 14px;
        }
        .member-item .info .name-id .id {
            font-size: 11px;
            color: #999;
        }
        .member-item .info .tag {
            background: #4caf50;
            color: #fff;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }
        .member-item .info .tag.off {
            background: #e53935;
        }
        .member-item .actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .member-item .actions a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #e8f5e9;
            transition: 0.2s;
        }
        .member-item .actions a:hover {
            background: #c8e6c9;
        }
        .member-item .actions .del {
            color: #c62828;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 18px;
            padding: 0 4px;
            line-height: 1;
        }
        .member-item .actions .del:hover {
            color: #b71c1c;
        }
        .member-item .edit-badge {
            font-size: 10px;
            color: #c9a84c;
            font-weight: 600;
            background: #fff8e1;
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid #c9a84c;
        }
        .member-item .edit-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #c9a84c;
            flex-shrink: 0;
            display: none;
        }
        .member-item.editing .edit-indicator {
            display: block;
        }

        .toast {
            background: #1b5e20;
            color: #fff;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            bottom: 40px;
        }
        .id-hint {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        .id-hint code {
            background: #f1f8e9;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #1b5e20;
        }
        .stats {
            display: flex;
            gap: 20px;
            padding: 12px 16px;
            background: #f1f8e9;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #2e7d32;
            flex-wrap: wrap;
        }
        .stats span {
            font-weight: 600;
        }
        .quick-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0 16px;
        }
        .quick-links a {
            display: inline-block;
            padding: 6px 16px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #a5d6a7;
            transition: 0.2s;
        }
        .quick-links a:hover {
            background: #c8e6c9;
        }
        .data-source {
            font-size: 12px;
            color: #888;
            text-align: center;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .data-source .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .data-source .badge.local {
            background: #fff3e0;
            color: #e65100;
        }
        .data-source .badge.github {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .sync-btn {
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .sync-btn:hover {
            background: #0d47a1;
        }
        .sync-btn.green {
            background: #2e7d32;
        }
        .sync-btn.green:hover {
            background: #1b5e20;
        }

        /* 编辑状态提示 */
        .edit-mode-hint {
            display: none;
            background: #fff8e1;
            border: 1px solid #c9a84c;
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #e65100;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .edit-mode-hint.show {
            display: flex;
        }
        .edit-mode-hint .btn-sm {
            margin-left: auto;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .loading-overlay.show {
            display: flex;
        }
        .loading-box {
            background: #fff;
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .loading-box .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8f5e9;
            border-top: 4px solid #2e7d32;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .panel {
                padding: 20px 16px;
            }
            .member-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .member-item .actions {
                width: 100%;
                justify-content: flex-end;
            }
            .quick-links a {
                font-size: 12px;
                padding: 4px 12px;
            }
            .data-source {
                font-size: 11px;
                flex-direction: column;
                gap: 6px;
            }
            .member-list {
                max-height: 300px;
            }
            .edit-mode-hint {
                font-size: 12px;
            }
            .edit-mode-hint .btn-sm {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <p id="loadingText">正在加载数据...</p>
        </div>
    </div>

    <div class="panel">
        <h1>
            🌱 成员管理
            <small id="totalCount">共 0 人</small>
        </h1>

        <!-- 数据源状态 -->
        <div class="data-source" id="dataSource">
            <span>📦 数据源：</span>
            <span class="badge local" id="sourceBadge">本地缓存</span>
            <span id="sourceInfo">未加载</span>
            <button class="sync-btn" id="syncFromGitHubBtn">🔄 从仓库同步</button>
            <button class="sync-btn green" id="exportToGitHubBtn">📤 导出到仓库</button>
        </div>

        <div class="stats">
            <span>👤 在职：<span id="activeCount">0</span></span>
            <span>📤 离职：<span id="inactiveCount">0</span></span>
        </div>

        <div class="quick-links">
            <a href="designer.html" target="_blank">🎨 名片设计器</a>
            <a href="qrcode.html" target="_blank">📱 二维码生成器</a>
            <a href="card.html" target="_blank">👁️ 名片预览</a>
        </div>

        <!-- 编辑模式提示 -->
        <div class="edit-mode-hint" id="editModeHint">
            ✏️ 正在编辑：<strong id="editingName">-</strong>（编号：<span id="editingId">-</span>）
            <button class="btn-sm warning" id="cancelEditBtn">取消编辑</button>
        </div>

        <form id="memberForm">
            <div class="row">
                <label>编号 (唯一ID)</label>
                <input type="text" id="inputId" placeholder="例如 CCPEFYHDC2026110001" required>
                <div class="id-hint">💡 建议格式：<code>CCPEFYHDC2026110001</code></div>
            </div>
            <div class="row">
                <label>姓名</label>
                <input type="text" id="inputName" placeholder="庄国辉" required>
            </div>
            <div class="row">
                <label>职务</label>
                <input type="text" id="inputTitle" placeholder="副主任兼办公室主任" required>
            </div>
            <div class="row">
                <label>职责描述</label>
                <textarea id="inputDuty" rows="3" placeholder="负责全面事务与统筹协调..."></textarea>
            </div>
            <div class="row">
                <label>电话</label>
                <input type="text" id="inputPhone" placeholder="18520661777">
            </div>
            <div class="row">
                <label>邮箱</label>
                <input type="text" id="inputEmail" placeholder="zjxqab@163.com">
            </div>
            <div class="row">
                <label>地址</label>
                <input type="text" id="inputAddress" placeholder="北京市通州区景盛二街12号纳特园区11号楼2层东厅">
            </div>
            <div class="row">
                <label>微信二维码 (上传图片)</label>
                <div class="file-group">
                    <input type="file" id="inputWechat" accept="image/*">
                    <div class="preview-box">
                        <img id="wechatPreview" class="qr-preview" style="display:none;" alt="微信预览">
                        <button type="button" class="btn-sm danger" id="clearWechat" style="display:none;">清除</button>
                    </div>
                </div>
            </div>
            <div class="row">
                <label>个人头像 (上传照片)</label>
                <div class="file-group">
                    <input type="file" id="inputAvatar" accept="image/*">
                    <div class="preview-box">
                        <img id="avatarPreview" style="display:none;" alt="头像预览">
                        <button type="button" class="btn-sm danger" id="clearAvatar" style="display:none;">清除</button>
                    </div>
                </div>
            </div>
            <div class="row">
                <label>在岗状态</label>
                <select id="inputStatus">
                    <option value="1">✅ 在职</option>
                    <option value="0">❌ 离职</option>
                </select>
            </div>
            <button type="submit" class="btn" id="submitBtn">➕ 添加成员</button>
        </form>

        <div class="btn-group" style="margin-top:16px;">
            <button id="resetDataBtn" class="btn danger">重置默认数据</button>
        </div>

        <!-- 成员列表 - 可滚动 -->
        <div class="member-list-wrap">
            <div class="list-header">
                <span class="count" id="listCount">共 0 人</span>
                <span style="font-size:12px;color:#999;">💡 点击成员可编辑</span>
            </div>
            <div class="member-list" id="memberList"></div>
        </div>

        <div class="btn-group" style="margin-top:16px;">
            <button id="exportBtn" class="btn outline">📤 导出 JSON</button>
            <button id="importBtn" class="btn outline">📥 导入 JSON</button>
            <input type="file" id="fileInput" accept=".json" style="display:none;">
        </div>
        <p style="font-size:11px; color:#aaa; margin-top:12px; text-align:center;">
            💡 点击 <strong>"从仓库同步"</strong> 加载 <code>members.json</code>
            · 点击 <strong>"导出到仓库"</strong> 下载 JSON 文件
        </p>
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script>
        // ================================================================
        // 配置
        // ================================================================

        const DB_KEY = 'emp_system_data';
        const JSON_FILE = 'members.json';

        function getBaseUrl() {
            const host = window.location.host;
            const pathname = window.location.pathname;
            const origin = window.location.origin;

            if (host.includes('127.0.0.1') || host.includes('localhost') || host.includes('192.168.')) {
                return origin + pathname.replace(/\/[^/]*$/, '');
            }

            if (host.includes('github.io')) {
                const parts = pathname.split('/').filter(p => p !== '');
                if (parts.length > 0) {
                    return origin + '/' + parts[0];
                }
                return origin;
            }

            return origin + pathname.replace(/\/[^/]*$/, '');
        }

        const BASE_URL = getBaseUrl();
        const JSON_URL = BASE_URL + '/' + JSON_FILE;

        // ================================================================
        // 默认数据
        // ================================================================

        const DEFAULT_EMPLOYEES = [{
            id: 'CCPEFYHDC2026110001',
            name: '庄国辉',
            title: '副主任兼办公室主任',
            duty: '负责健康工作委员会全面事务与统筹协调。具体包括：主持办公室全面工作，统筹协调各内设机构日常运转；负责秘书处日常工作，承担文秘、会务、机要、档案等综合管理；协调各副主任委员分管工作，督办重要会议事项落实；负责人事、财务、资产、后勤等行政事务管理；负责会员管理、对外联络与来访接待工作。',
            phone: '18520661777',
            email: 'zjxqab@163.com',
            address: '北京市通州区景盛二街12号纳特园区11号楼2层东厅',
            wechatQr: '',
            avatar: '',
            status: 1
        }, {
            id: 'CCPEFYHDC2026110002',
            name: '黄金平',
            title: '副主任',
            duty: '负责青少年生态健康项目统筹',
            phone: '13337819393',
            email: '2924603747@qq.com',
            address: '北京市通州区景盛二街12号纳特园区11号楼2层东厅',
            wechatQr: '',
            avatar: '',
            status: 1
        }];

        // ================================================================
        // 数据操作
        // ================================================================

        let employees = [];
        let dataSource = 'local';
        let editingId = null; // 正在编辑的成员ID

        function getEmployees() {
            return employees;
        }

        function setEmployees(data) {
            employees = data;
            localStorage.setItem(DB_KEY, JSON.stringify(data));
            renderList();
            updateStats();
            updateListCount();
        }

        function getMember(id) {
            return employees.find(e => e.id === id) || null;
        }

        function saveMember(member) {
            const idx = employees.findIndex(e => e.id === member.id);
            if (idx > -1) {
                employees[idx] = member;
            } else {
                employees.push(member);
            }
            localStorage.setItem(DB_KEY, JSON.stringify(employees));
            renderList();
            updateStats();
            updateListCount();
            return employees;
        }

        function deleteMember(id) {
            employees = employees.filter(e => e.id !== id);
            localStorage.setItem(DB_KEY, JSON.stringify(employees));
            renderList();
            updateStats();
            updateListCount();
            return employees;
        }

        // ================================================================
        // 从 GitHub 加载数据
        // ================================================================

        async function loadFromGitHub() {
            showLoading('正在从仓库加载数据...');
            try {
                const response = await fetch(JSON_URL, {
                    cache: 'no-cache',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    employees = data;
                    localStorage.setItem(DB_KEY, JSON.stringify(data));
                    dataSource = 'github';
                    updateDataSourceUI('✅ 已从仓库加载', 'github');
                    renderList();
                    updateStats();
                    updateListCount();
                    showToast('✅ 已从仓库加载 ' + data.length + ' 条数据');
                } else {
                    throw new Error('数据为空');
                }
            } catch (e) {
                console.warn('⚠️ 从仓库加载失败:', e.message);
                const stored = localStorage.getItem(DB_KEY);
                if (stored) {
                    try {
                        employees = JSON.parse(stored);
                        if (employees.length > 0) {
                            dataSource = 'local';
                            updateDataSourceUI('⚠️ 仓库加载失败，使用本地缓存', 'local');
                            renderList();
                            updateStats();
                            updateListCount();
                            showToast('⚠️ 仓库加载失败，使用本地缓存');
                            return;
                        }
                    } catch (e2) {}
                }
                employees = JSON.parse(JSON.stringify(DEFAULT_EMPLOYEES));
                localStorage.setItem(DB_KEY, JSON.stringify(employees));
                dataSource = 'local';
                updateDataSourceUI('⚠️ 仓库加载失败，使用默认数据', 'local');
                renderList();
                updateStats();
                updateListCount();
                showToast('⚠️ 仓库加载失败，使用默认数据');
            } finally {
                hideLoading();
            }
        }

        // ================================================================
        // 导出到 GitHub
        // ================================================================

        function exportToGitHub() {
            const data = getEmployees();
            if (data.length === 0) {
                showToast('⚠️ 没有数据可导出');
                return;
            }

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'members.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('✅ 已下载 members.json，请上传到 GitHub 仓库根目录');
        }

        // ================================================================
        // UI 更新
        // ================================================================

        function updateDataSourceUI(status, source) {
            const badge = document.getElementById('sourceBadge');
            const info = document.getElementById('sourceInfo');

            if (source === 'github') {
                badge.textContent = '📦 仓库数据';
                badge.className = 'badge github';
                info.textContent = status + ' | ' + employees.length + ' 人';
            } else {
                badge.textContent = '💻 本地缓存';
                badge.className = 'badge local';
                info.textContent = status + ' | ' + employees.length + ' 人';
            }
        }

        function updateListCount() {
            document.getElementById('listCount').textContent = '共 ' + employees.length + ' 人';
        }

        function renderList() {
            const list = document.getElementById('memberList');
            if (employees.length === 0) {
                list.innerHTML = '<p style="color:#999; text-align:center; padding:20px;">暂无成员</p>';
                return;
            }

            list.innerHTML = employees.map(emp => {
                let thumb = emp.avatar ? `<img src="${emp.avatar}" class="thumb">` :
                    `<div class="thumb">${emp.name.charAt(0)}</div>`;
                let wechatIcon = emp.wechatQr ? '📱' : '';
                const isEditing = editingId === emp.id;
                return `
                    <div class="member-item ${isEditing ? 'editing' : ''}" data-id="${emp.id}">
                        <div class="info">
                            ${thumb}
                            <div class="name-id">
                                <span class="name">${emp.name}</span>
                                <span class="id">${emp.id}</span>
                            </div>
                            <span class="tag ${emp.status===0?'off':''}">${emp.status===1?'在职':'离职'}</span>
                            ${wechatIcon ? `<span style="font-size:12px;color:#4caf50;">${wechatIcon}</span>` : ''}
                            ${isEditing ? '<span class="edit-badge">✏️ 编辑中</span>' : ''}
                            <span class="edit-indicator"></span>
                        </div>
                        <div class="actions">
                            <a href="card.html?id=${emp.id}" target="_blank">名片</a>
                            <a href="designer.html?id=${emp.id}" target="_blank">设计</a>
                            <a href="qrcode.html?id=${emp.id}" target="_blank">二维码</a>
                            <button class="del" data-id="${emp.id}" title="删除">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            // 点击成员项 → 加载到表单编辑
            list.querySelectorAll('.member-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    // 如果点击的是删除按钮或链接，不触发编辑
                    if (e.target.closest('.del') || e.target.closest('a')) return;
                    const id = this.dataset.id;
                    loadMemberToForm(id);
                });
            });

            // 删除按钮
            list.querySelectorAll('.del').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    if (confirm(`确定删除 ${id} 吗？`)) {
                        if (editingId === id) {
                            cancelEdit();
                        }
                        deleteMember(id);
                        showToast('已删除');
                    }
                });
            });
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = '共 ' + employees.length + ' 人';
            const active = employees.filter(e => e.status === 1).length;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('inactiveCount').textContent = employees.length - active;
        }

        // ================================================================
        // 编辑功能
        // ================================================================

        function loadMemberToForm(id) {
            const member = getMember(id);
            if (!member) {
                showToast('⚠️ 未找到该成员');
                return;
            }

            editingId = id;

            // 填充表单
            document.getElementById('inputId').value = member.id;
            document.getElementById('inputId').disabled = true; // 编辑时禁止修改ID
            document.getElementById('inputName').value = member.name;
            document.getElementById('inputTitle').value = member.title;
            document.getElementById('inputDuty').value = member.duty || '';
            document.getElementById('inputPhone').value = member.phone || '';
            document.getElementById('inputEmail').value = member.email || '';
            document.getElementById('inputAddress').value = member.address || '';
            document.getElementById('inputStatus').value = member.status;

            // 显示头像和微信码
            if (member.avatar) {
                const img = document.getElementById('avatarPreview');
                img.src = member.avatar;
                img.style.display = 'block';
                document.getElementById('clearAvatar').style.display = 'inline-block';
            }
            if (member.wechatQr) {
                const img = document.getElementById('wechatPreview');
                img.src = member.wechatQr;
                img.style.display = 'block';
                document.getElementById('clearWechat').style.display = 'inline-block';
            }

            // 更新UI
            document.getElementById('submitBtn').textContent = '✏️ 更新成员';
            document.getElementById('submitBtn').style.background = '#f57c00';
            document.getElementById('editModeHint').classList.add('show');
            document.getElementById('editingName').textContent = member.name;
            document.getElementById('editingId').textContent = member.id;

            // 高亮列表中的编辑项
            renderList();

            // 滚动到表单
            document.querySelector('form').scrollIntoView({ behavior: 'smooth', block: 'start' });

            showToast('✏️ 正在编辑：' + member.name);
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('inputId').disabled = false;
            document.getElementById('submitBtn').textContent = '➕ 添加成员';
            document.getElementById('submitBtn').style.background = '#2e7d32';
            document.getElementById('editModeHint').classList.remove('show');

            // 不清空表单，方便继续添加
            renderList();
        }

        document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);

        // ================================================================
        // 表单提交（添加/更新）
        // ================================================================

        document.getElementById('memberForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const id = document.getElementById('inputId').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const title = document.getElementById('inputTitle').value.trim();
            const duty = document.getElementById('inputDuty').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const email = document.getElementById('inputEmail').value.trim();
            const address = document.getElementById('inputAddress').value.trim();
            const status = parseInt(document.getElementById('inputStatus').value);
            const avatar = document.getElementById('avatarPreview').src || '';
            const wechatQr = document.getElementById('wechatPreview').src || '';

            if (!id || !name || !title) {
                showToast('请完整填写编号、姓名和职务');
                return;
            }

            // 如果是编辑模式，检查ID是否匹配
            if (editingId && editingId !== id) {
                showToast('⚠️ 编辑状态下不能修改编号');
                return;
            }

            const existing = getMember(id);
            const isNew = !existing;

            // 如果是编辑模式，但ID不存在（异常情况）
            if (editingId && !existing) {
                cancelEdit();
            }

            const member = {
                id,
                name,
                title,
                duty,
                phone,
                email,
                address,
                wechatQr: isNew ? wechatQr : (wechatQr || existing.wechatQr || ''),
                avatar: isNew ? avatar : (avatar || existing.avatar || ''),
                status
            };

            saveMember(member);
            showToast(isNew ? `✅ 已添加 ${name}` : `✅ 已更新 ${name}`);

            // 清空表单
            document.getElementById('inputId').disabled = false;
            document.getElementById('inputId').value = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputDuty').value = '';
            document.getElementById('inputPhone').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputAddress').value = '';
            document.getElementById('avatarPreview').style.display = 'none';
            document.getElementById('avatarPreview').src = '';
            document.getElementById('clearAvatar').style.display = 'none';
            document.getElementById('wechatPreview').style.display = 'none';
            document.getElementById('wechatPreview').src = '';
            document.getElementById('clearWechat').style.display = 'none';
            document.getElementById('inputAvatar').value = '';
            document.getElementById('inputWechat').value = '';

            document.getElementById('submitBtn').textContent = '➕ 添加成员';
            document.getElementById('submitBtn').style.background = '#2e7d32';
            document.getElementById('editModeHint').classList.remove('show');
            editingId = null;

            updateDataSourceUI('已修改，请导出到仓库', 'local');
            renderList();
        });

        // ================================================================
        // 图片预览
        // ================================================================

        document.getElementById('inputAvatar').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = document.getElementById('avatarPreview');
                    img.src = ev.target.result;
                    img.style.display = 'block';
                    document.getElementById('clearAvatar').style.display = 'inline-block';
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('clearAvatar').addEventListener('click', function() {
            document.getElementById('inputAvatar').value = '';
            document.getElementById('avatarPreview').style.display = 'none';
            document.getElementById('avatarPreview').src = '';
            this.style.display = 'none';
        });

        document.getElementById('inputWechat').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = document.getElementById('wechatPreview');
                    img.src = ev.target.result;
                    img.style.display = 'block';
                    document.getElementById('clearWechat').style.display = 'inline-block';
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('clearWechat').addEventListener('click', function() {
            document.getElementById('inputWechat').value = '';
            document.getElementById('wechatPreview').style.display = 'none';
            document.getElementById('wechatPreview').src = '';
            this.style.display = 'none';
        });

        // ================================================================
        // 按钮事件
        // ================================================================

        document.getElementById('syncFromGitHubBtn').addEventListener('click', function() {
            loadFromGitHub();
        });

        document.getElementById('exportToGitHubBtn').addEventListener('click', function() {
            exportToGitHub();
        });

        document.getElementById('exportBtn').addEventListener('click', function() {
            const data = getEmployees();
            if (data.length === 0) {
                showToast('⚠️ 没有数据可导出');
                return;
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `members_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            showToast('导出成功');
        });

        document.getElementById('importBtn').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data)) {
                        setEmployees(data);
                        dataSource = 'local';
                        updateDataSourceUI('✅ 已导入 ' + data.length + ' 条数据', 'local');
                        showToast('导入成功');
                    } else {
                        showToast('格式错误');
                    }
                } catch (err) {
                    showToast('解析失败');
                }
            };
            reader.readAsText(file);
            this.value = '';
        });

        document.getElementById('resetDataBtn').addEventListener('click', function() {
            if (confirm('重置将恢复默认数据，确定吗？')) {
                employees = JSON.parse(JSON.stringify(DEFAULT_EMPLOYEES));
                localStorage.setItem(DB_KEY, JSON.stringify(employees));
                dataSource = 'local';
                updateDataSourceUI('已重置为默认数据', 'local');
                renderList();
                updateStats();
                updateListCount();
                showToast('已重置');
            }
        });

        // ================================================================
        // Loading
        // ================================================================

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text || '加载中...';
            document.getElementById('loadingOverlay').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        // ================================================================
        // Toast
        // ================================================================

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ================================================================
        // 启动
        // ================================================================

        async function init() {
            await loadFromGitHub();
            if (employees.length === 0) {
                const stored = localStorage.getItem(DB_KEY);
                if (stored) {
                    try {
                        employees = JSON.parse(stored);
                        if (employees.length > 0) {
                            dataSource = 'local';
                            updateDataSourceUI('使用本地缓存', 'local');
                            renderList();
                            updateStats();
                            updateListCount();
                            return;
                        }
                    } catch (e) {}
                }
                employees = JSON.parse(JSON.stringify(DEFAULT_EMPLOYEES));
                localStorage.setItem(DB_KEY, JSON.stringify(employees));
                dataSource = 'local';
                updateDataSourceUI('使用默认数据', 'local');
                renderList();
                updateStats();
                updateListCount();
            }
        }

        init();
        console.log('✅ 管理后台已启动');
        console.log('📌 点击成员可编辑');
    </script>
</body>
</html>
