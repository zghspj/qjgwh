<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名片设计器</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
        }
        body {
            background: #e8f0e8;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .top-toolbar {
            background: #fff;
            padding: 10px 20px;
            border-bottom: 2px solid #c8e6c9;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            flex-wrap: wrap;
            z-index: 50;
        }
        .top-toolbar .title {
            font-size: 18px;
            font-weight: 700;
            color: #1b5e20;
        }
        .top-toolbar select {
            padding: 6px 14px;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            font-size: 14px;
            background: #f9fbf9;
            min-width: 180px;
        }
        .top-toolbar .btn-sm {
            background: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .top-toolbar .btn-sm:hover {
            background: #1b5e20;
        }
        .top-toolbar .btn-sm.danger {
            background: #c62828;
        }
        .top-toolbar .btn-sm.danger:hover {
            background: #b71c1c;
        }
        .top-toolbar .btn-sm.outline {
            background: transparent;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }
        .top-toolbar .btn-sm.outline:hover {
            background: #2e7d32;
            color: #fff;
        }
        .top-toolbar .member-status {
            font-size: 13px;
            color: #555;
            margin-left: auto;
        }
        .top-toolbar .refresh-btn {
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
        }
        .top-toolbar .refresh-btn:hover {
            background: #0d47a1;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 240px;
            background: #fff;
            padding: 12px;
            border-right: 2px solid #c8e6c9;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }
        .sidebar h3 {
            font-size: 13px;
            color: #1b5e20;
            border-bottom: 1px solid #c8e6c9;
            padding-bottom: 4px;
            margin-bottom: 4px;
        }
        .element-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .element-item {
            background: #f1f8e9;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #a5d6a7;
            cursor: grab;
            font-size: 12px;
            color: #2e7d32;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .element-item:hover {
            background: #c8e6c9;
        }
        .upload-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .upload-btn {
            background: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
            flex: 1;
        }
        .upload-btn:hover {
            background: #1b5e20;
        }
        input[type="file"] {
            display: none;
        }
        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 4px 0;
        }
        .palette .color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: 0.2s;
        }
        .palette .color-swatch:hover {
            transform: scale(1.1);
        }
        .props-panel {
            border-top: 1px solid #c8e6c9;
            padding-top: 6px;
            margin-top: auto;
            overflow-y: auto;
            max-height: 300px;
        }
        .props-panel .prop-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 3px;
            flex-wrap: wrap;
        }
        .props-panel .prop-row label {
            font-size: 11px;
            color: #444;
            min-width: 24px;
        }
        .props-panel .prop-row input[type="color"] {
            width: 26px;
            height: 26px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 2px;
        }
        .props-panel .prop-row input[type="range"] {
            width: 70px;
            accent-color: #2e7d32;
        }
        .props-panel .prop-row .range-val {
            font-size: 11px;
            color: #2e7d32;
            font-weight: 600;
            min-width: 24px;
        }
        .props-panel .prop-row select {
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 11px;
        }
        .props-panel .btn-sm {
            background: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 3px 10px;
            cursor: pointer;
            font-size: 11px;
        }
        .props-panel .btn-sm:hover {
            background: #1b5e20;
        }
        .props-panel .btn-sm.danger {
            background: #c62828;
        }
        .props-panel .btn-sm.danger:hover {
            background: #b71c1c;
        }

        .canvas-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #d0dcd0;
            padding: 20px;
            overflow: auto;
            position: relative;
        }
        .canvas {
            width: 420px;
            min-height: 600px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            padding: 24px 20px 16px;
            border: 2px solid #81c784;
            flex-shrink: 0;
        }
        .canvas .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 36px;
            font-weight: 900;
            color: rgba(46, 125, 50, 0.06);
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 6px;
            width: 200%;
            text-align: center;
        }
        .canvas .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #2e7d32, #81c784, #c9a84c);
            border-radius: 28px 28px 0 0;
        }
        .drag-element {
            position: absolute;
            cursor: move;
            padding: 4px;
            border-radius: 6px;
            border: 2px dashed transparent;
            transition: border 0.2s, box-shadow 0.2s;
            background: transparent;
            min-width: 10px;
            min-height: 10px;
            z-index: 1;
            pointer-events: auto;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2px;
        }
        .drag-element:hover {
            border-color: #4caf50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }
        .drag-element.selected {
            border-color: #c9a84c;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.4);
            z-index: 2;
        }
        .drag-element .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #c62828;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            display: none;
            z-index: 10;
        }
        .drag-element.selected .remove-btn {
            display: block;
        }
        .transform-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #c9a84c;
            border: 1px solid #fff;
            border-radius: 50%;
            display: none;
            z-index: 20;
            pointer-events: auto;
        }
        .drag-element.selected .transform-handle {
            display: block;
        }
        .handle-tl {
            top: -5px;
            left: -5px;
            cursor: nw-resize;
        }
        .handle-tr {
            top: -5px;
            right: -5px;
            cursor: ne-resize;
        }
        .handle-bl {
            bottom: -5px;
            left: -5px;
            cursor: sw-resize;
        }
        .handle-br {
            bottom: -5px;
            right: -5px;
            cursor: se-resize;
        }
        .handle-t {
            top: -5px;
            left: 50%;
            margin-left: -5px;
            cursor: n-resize;
        }
        .handle-b {
            bottom: -5px;
            left: 50%;
            margin-left: -5px;
            cursor: s-resize;
        }
        .handle-l {
            top: 50%;
            left: -5px;
            margin-top: -5px;
            cursor: w-resize;
        }
        .handle-r {
            top: 50%;
            right: -5px;
            margin-top: -5px;
            cursor: e-resize;
        }
        .drag-element img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1b5e20;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 180px;
                padding: 8px;
            }
            .canvas {
                transform: scale(0.75);
                transform-origin: center center;
            }
        }
        @media (max-width: 600px) {
            .main {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 180px;
                border-right: none;
                border-bottom: 2px solid #c8e6c9;
                flex-direction: row;
                flex-wrap: wrap;
                align-content: flex-start;
                gap: 4px;
                padding: 6px;
                overflow-y: auto;
            }
            .sidebar h3 {
                width: 100%;
                margin-bottom: 2px;
                font-size: 12px;
            }
            .element-list {
                flex-wrap: wrap;
            }
            .element-item {
                font-size: 10px;
                padding: 3px 8px;
            }
            .props-panel {
                display: none;
            }
            .canvas-wrapper {
                padding: 10px;
            }
            .canvas {
                transform: scale(0.55);
                transform-origin: top center;
            }
            .top-toolbar {
                padding: 6px 12px;
                gap: 6px;
            }
            .top-toolbar select {
                min-width: 120px;
                font-size: 12px;
                padding: 4px 10px;
            }
            .top-toolbar .btn-sm {
                font-size: 11px;
                padding: 4px 10px;
            }
            .top-toolbar .title {
                font-size: 15px;
            }
            .top-toolbar .member-status {
                font-size: 11px;
            }
            .top-toolbar .refresh-btn {
                font-size: 10px;
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部工具栏 -->
    <div class="top-toolbar">
        <span class="title">🎨 名片设计器</span>
        <label>选择人员：</label>
        <select id="memberSelector">
            <option value="">-- 加载中 --</option>
        </select>
        <button class="btn-sm" id="saveDesignBtn">💾 保存</button>
        <button class="btn-sm outline" id="previewBtn">👁️ 预览</button>
        <button class="btn-sm danger" id="resetDesignBtn">↩️ 重置</button>
        <button class="refresh-btn" id="refreshBtn">🔄 刷新数据</button>
        <span class="member-status" id="memberStatus">未选择</span>
    </div>

    <!-- 主内容 -->
    <div class="main">
        <!-- 左侧面板 -->
        <div class="sidebar">
            <h3>🧩 元素面板</h3>
            <div class="element-list" id="elementList">
                <div class="element-item" data-type="logo-left" draggable="true">🏷️ 委员会Logo</div>
                <div class="element-item" data-type="logo-right" draggable="true">🏷️ 总会Logo</div>
                <div class="element-item" data-type="image" draggable="true">🖼️ 图片</div>
                <div class="element-item" data-type="text" draggable="true">📝 文字</div>
                <div class="element-item" data-type="name" draggable="true">📛 姓名</div>
                <div class="element-item" data-type="title" draggable="true">💼 职务</div>
                <div class="element-item" data-type="id" draggable="true">🔢 编号</div>
                <div class="element-item" data-type="duty" draggable="true">📋 职责</div>
                <div class="element-item" data-type="status-badge" draggable="true">🟢 在岗状态</div>
                <div class="element-item" data-type="org" draggable="true">🏛️ 单位</div>
                <div class="element-item" data-type="phone" draggable="true">📞 电话</div>
                <div class="element-item" data-type="email" draggable="true">✉️ 邮箱</div>
                <div class="element-item" data-type="address" draggable="true">📍 地址</div>
                <div class="element-item" data-type="wechat" draggable="true">📱 微信码</div>
                <div class="element-item" data-type="qr" draggable="true">🔲 核验码</div>
                <div class="element-item" data-type="slogan" draggable="true">🌍 口号</div>
                <div class="element-item" data-type="line" draggable="true">─ 装饰线</div>
                <div class="element-item" data-type="shape-rect" draggable="true">▭ 长方形</div>
                <div class="element-item" data-type="shape-square" draggable="true">▢ 正方形</div>
                <div class="element-item" data-type="shape-triangle" draggable="true">△ 三角形</div>
                <div class="element-item" data-type="shape-diamond" draggable="true">◇ 菱形</div>
                <div class="element-item" data-type="shape-heart" draggable="true">♥ 心形</div>
                <div class="element-item" data-type="shape-star" draggable="true">★ 五角星</div>
                <div class="element-item" data-type="shape-circle" draggable="true">◯ 圆形</div>
                <div class="element-item" data-type="shape-ellipse" draggable="true">⬮ 椭圆</div>
                <div class="element-item" data-type="divider" draggable="true">─ 分割线</div>
            </div>

            <h3>📤 上传图片</h3>
            <div class="upload-group">
                <button class="upload-btn" id="uploadImageBtn">🖼️ 上传图片</button>
                <input type="file" id="imageFileInput" accept="image/*">
                <button class="upload-btn" id="uploadWechatBtn">📱 上传微信码</button>
                <input type="file" id="wechatFileInput" accept="image/*">
            </div>

            <h3>🎨 调色板</h3>
            <div class="palette" id="palette">
                <div class="color-swatch" style="background:#1b5e20;" data-color="#1b5e20"></div>
                <div class="color-swatch" style="background:#2e7d32;" data-color="#2e7d32"></div>
                <div class="color-swatch" style="background:#4caf50;" data-color="#4caf50"></div>
                <div class="color-swatch" style="background:#81c784;" data-color="#81c784"></div>
                <div class="color-swatch" style="background:#c8e6c9;" data-color="#c8e6c9"></div>
                <div class="color-swatch" style="background:#c9a84c;" data-color="#c9a84c"></div>
                <div class="color-swatch" style="background:#f44336;" data-color="#f44336"></div>
                <div class="color-swatch" style="background:#e91e63;" data-color="#e91e63"></div>
                <div class="color-swatch" style="background:#9c27b0;" data-color="#9c27b0"></div>
                <div class="color-swatch" style="background:#2196f3;" data-color="#2196f3"></div>
                <div class="color-swatch" style="background:#ff9800;" data-color="#ff9800"></div>
                <div class="color-swatch" style="background:#ffffff; border:1px solid #aaa;" data-color="#ffffff"></div>
            </div>

            <!-- 属性面板 -->
            <div class="props-panel" id="propsPanel">
                <h3 style="font-size:12px; margin-bottom:3px;">🎛️ 属性</h3>
                <div class="prop-row">
                    <label>左</label>
                    <input type="range" id="propLeft" min="0" max="400" value="20" step="1">
                    <span class="range-val" id="propLeftVal">20</span>
                </div>
                <div class="prop-row">
                    <label>顶</label>
                    <input type="range" id="propTop" min="0" max="600" value="20" step="1">
                    <span class="range-val" id="propTopVal">20</span>
                </div>
                <div class="prop-row">
                    <label>宽</label>
                    <input type="range" id="propWidth" min="10" max="400" value="100" step="1">
                    <span class="range-val" id="propWidthVal">100</span>
                </div>
                <div class="prop-row">
                    <label>高</label>
                    <input type="range" id="propHeight" min="10" max="400" value="40" step="1">
                    <span class="range-val" id="propHeightVal">40</span>
                </div>
                <div class="prop-row">
                    <label>颜色</label>
                    <input type="color" id="propColor" value="#1b5e20">
                </div>
                <div class="prop-row">
                    <label>背景</label>
                    <input type="color" id="propBg" value="#ffffff">
                </div>
                <div class="prop-row">
                    <label>边框</label>
                    <select id="propBorder">
                        <option value="none">无</option>
                        <option value="solid 2px #4caf50">实线</option>
                        <option value="dashed 2px #4caf50">虚线</option>
                        <option value="dotted 2px #4caf50">点线</option>
                    </select>
                </div>
                <div class="prop-row">
                    <label>圆角</label>
                    <input type="range" id="propRadius" min="0" max="50" value="8" step="1">
                    <span class="range-val" id="propRadiusVal">8</span>
                </div>
                <div class="prop-row">
                    <label>字号</label>
                    <input type="range" id="propFontSize" min="8" max="72" value="14" step="1">
                    <span class="range-val" id="propFontSizeVal">14</span>
                </div>
                <div class="prop-row">
                    <label>字体</label>
                    <select id="propFontFamily">
                        <option value="'PingFang SC','Microsoft YaHei',sans-serif">默认</option>
                        <option value="Arial, sans-serif">Arial</option>
                        <option value="'Times New Roman', serif">Times</option>
                        <option value="Georgia, serif">Georgia</option>
                        <option value="'Courier New', monospace">Courier</option>
                        <option value="'Comic Sans MS', cursive">Comic Sans</option>
                        <option value="'Impact', sans-serif">Impact</option>
                    </select>
                </div>
                <div class="prop-row">
                    <label>对齐</label>
                    <select id="propTextAlign">
                        <option value="center">居中</option>
                        <option value="left">左对齐</option>
                        <option value="right">右对齐</option>
                    </select>
                </div>
                <div class="prop-row">
                    <label>粗细</label>
                    <select id="propFontWeight">
                        <option value="normal">常规</option>
                        <option value="bold">加粗</option>
                        <option value="lighter">细体</option>
                    </select>
                </div>
                <div class="prop-row" style="flex-wrap:wrap; gap:3px;">
                    <button class="btn-sm" id="deleteElementBtn">🗑️ 删除</button>
                    <button class="btn-sm" id="duplicateElementBtn">📋 复制</button>
                    <button class="btn-sm" id="moveUpBtn">⬆ 上移</button>
                    <button class="btn-sm" id="moveDownBtn">⬇ 下移</button>
                </div>
                <div class="prop-row">
                    <button class="btn-sm" id="editTextBtn" style="display:none;">✏️ 编辑文字</button>
                </div>
                <div class="prop-row">
                    <button class="btn-sm" id="uploadLogoBtn" style="display:none;">🖼️ 更换Logo</button>
                    <input type="file" id="logoFileInput" accept="image/*" style="display:none;">
                </div>
                <div style="font-size:10px; color:#888; margin-top:2px;" id="logoHint">💡 双击Logo可上传图片</div>
            </div>
        </div>

        <!-- 画布 -->
        <div class="canvas-wrapper">
            <div class="canvas" id="canvas">
                <div class="watermark">中国林业与环境促进会</div>
                <div class="top-bar"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script>

        // ================================================================

        function compressImage(file, maxWidth = 300, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = height * (maxWidth / width);
                            width = maxWidth;
                        }
                        if (height > maxWidth) {
                            width = width * (maxWidth / height);
                            height = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function renderElements() {
            canvasEl.querySelectorAll('.drag-element').forEach(el => el.remove());

                const dom = createElementDOM(el);
                canvasEl.appendChild(dom);
            });

                const dom = canvasEl.querySelector(`.drag-element[data-id="${selectedId}"]`);

            if (data.textAlign) div.style.textAlign = data.textAlign;
            if (data.fontWeight) div.style.fontWeight = data.fontWeight;

                    startDrag(e, data.id);

        function startDrag(e, id) {
            const el = elements.find(el => el.id === id);
            if (!el) return;
            const rect = canvasEl.getBoundingClientRect();
            const scaleX = 420 / rect.width;
            const scaleY = 600 / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            dragOffsetX = mouseX - el.left;
            dragOffsetY = mouseY - el.top;
            isDragging = true;
            dragTarget = id;
            canvasEl.style.cursor = 'grabbing';
            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
        }

        function onDragMove(e) {
            if (!isDragging || dragTarget === null) return;
            const rect = canvasEl.getBoundingClientRect();
            const scaleX = 420 / rect.width;
            const scaleY = 600 / rect.height;
            let mx = (e.clientX - rect.left) * scaleX;
            let my = (e.clientY - rect.top) * scaleY;
            mx = Math.max(0, Math.min(420, mx));
            my = Math.max(0, Math.min(600, my));
            const el = elements.find(el => el.id === dragTarget);
            if (!el) return;
            el.left = Math.round(mx - dragOffsetX);
            el.top = Math.round(my - dragOffsetY);
            el.left = Math.max(0, Math.min(420 - el.width, el.left));
            el.top = Math.max(0, Math.min(600 - el.height, el.top));
            const dom = canvasEl.querySelector(`.drag-element[data-id="${dragTarget}"]`);
            if (dom) { dom.style.left = el.left + 'px';
                dom.style.top = el.top + 'px'; }
            updatePropsPanel();
        }

        function onDragEnd() {
            isDragging = false;
            dragTarget = null;
            canvasEl.style.cursor = 'default';
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            if (currentMemberId) saveDesign(currentMemberId, elements);
        }

        function startResize(e, id, handle) {
            const el = elements.find(el => el.id === id);
            if (!el) return;
            const rect = canvasEl.getBoundingClientRect();
            const scaleX = 420 / rect.width;
            const scaleY = 600 / rect.height;
            resizeStartX = (e.clientX - rect.left) * scaleX;
            resizeStartY = (e.clientY - rect.top) * scaleY;
            resizeStartW = el.width;
            resizeStartH = el.height;
            resizeStartL = el.left;
            resizeStartT = el.top;
            resizeTarget = id;
            resizeHandle = handle;
            isResizing = true;
            document.addEventListener('mousemove', onResizeMove);
            document.addEventListener('mouseup', onResizeEnd);
            e.stopPropagation();
        }

        function onResizeMove(e) {
            if (!isResizing || resizeTarget === null) return;
            const rect = canvasEl.getBoundingClientRect();
            const scaleX = 420 / rect.width;
            const scaleY = 600 / rect.height;
            let mx = (e.clientX - rect.left) * scaleX;
            let my = (e.clientY - rect.top) * scaleY;
            mx = Math.max(0, Math.min(420, mx));
            my = Math.max(0, Math.min(600, my));
            const el = elements.find(el => el.id === resizeTarget);
            if (!el) return;
            let dx = mx - resizeStartX,
                dy = my - resizeStartY;
            let newL = resizeStartL,
                newT = resizeStartT,
                newW = resizeStartW,
                newH = resizeStartH;
            const h = resizeHandle;
            if (h.includes('r')) { newW = Math.max(10, resizeStartW + dx); }
            if (h.includes('l')) { newW = Math.max(10, resizeStartW - dx);
                newL = resizeStartL + resizeStartW - newW; }
            if (h.includes('b')) { newH = Math.max(10, resizeStartH + dy); }
            if (h.includes('t')) { newH = Math.max(10, resizeStartH - dy);
                newT = resizeStartT + resizeStartH - newH; }
            newW = Math.max(10, newW);
            newH = Math.max(10, newH);
            newL = Math.max(0, Math.min(420 - newW, newL));
            newT = Math.max(0, Math.min(600 - newH, newT));
            el.left = Math.round(newL);
            el.top = Math.round(newT);
            el.width = Math.round(newW);
            el.height = Math.round(newH);
            const dom = canvasEl.querySelector(`.drag-element[data-id="${resizeTarget}"]`);
            if (dom) { dom.style.left = el.left + 'px';
                dom.style.top = el.top + 'px';
                dom.style.width = el.width + 'px';
                dom.style.height = el.height + 'px'; }
            updatePropsPanel();
        }

        function onResizeEnd() {
            isResizing = false;
            resizeTarget = null;
            resizeHandle = null;
            document.removeEventListener('mousemove', onResizeMove);
            document.removeEventListener('mouseup', onResizeEnd);
            if (currentMemberId) saveDesign(currentMemberId, elements);
        }

                    content: 'QR_PLACEHOLDER' },
                slogan: { w: 180, h: 30, fontSize: 16, content: '🌍 口号', textAlign: 'left', fontWeight: 'bold' },
                line: { w: 120, h: 20, color: '#333', border: 'none', radius: 0, fontSize: 0, content: '',
                    lineWidth: 2 },
                'shape-rect': { w: 100, h: 70, bg: '#4caf50', border: 'solid 2px #2e7d32', radius: 0,
                    fontSize: 0, content: '' },
                'shape-square': { w: 80, h: 80, bg: '#4caf50', border: 'solid 2px #2e7d32', radius: 0,
                    fontSize: 0, content: '' },
                'shape-triangle': { w: 100, h: 90, bg: '#4caf50', border: 'solid 2px #2e7d32', radius: 0,
                    fontSize: 0, content: '' },
                'shape-diamond': { w: 80, h: 80, bg: '#4caf50', border: 'solid 2px #2e7d32', radius: 0,
                    fontSize: 0, content: '' },
                'shape-heart': { w: 80, h: 80, bg: '#e91e63', border: 'solid 2px #c62828', radius: 0,
                    fontSize: 0, content: '' },
                'shape-star': { w: 80, h: 80, bg: '#ff9800', border: 'solid 2px #e65100', radius: 0,
                    fontSize: 0, content: '' },
                'shape-circle': { w: 80, h: 80, bg: '#4caf50', border: 'solid 2px #2e7d32', radius: 50,
                    fontSize: 0, content: '' },
                'shape-ellipse': { w: 100, h: 60, bg: '#4caf50', border: 'solid 2px #2e7d32', radius: 50,
                    fontSize: 0, content: '' },
                divider: { w: 200, h: 2, border: 'solid 2px #c8e6c9', bg: 'transparent', radius: 0, fontSize: 0,
                    content: '' }
            };

            const cfg = config[type];
            if (cfg) Object.assign(newEl, cfg);
            if (type === 'image') {
                newEl.width = 100;
                newEl.height = 100;
                newEl.imageData = null;
                newEl.placeholder = '图片';
                newEl.bg = '#ffffff';
                newEl.border = 'solid 1px #c8e6c9';
            }

            elements.push(newEl);
            if (currentMemberId) saveDesign(currentMemberId, elements);
            renderElements();
            selectElement(newEl.id);
            showToast('✅ 已添加 ' + type);
        });

        // ================================================================
        // 人员选择与加载
        // ================================================================

        function populateMemberSelector() {
            const sel = document.getElementById('memberSelector');
            const employees = getEmployees();

            console.log('📌 populateMemberSelector, 员工数量:', employees.length);

            sel.innerHTML = '';
            if (employees.length === 0) {
                sel.innerHTML = '<option value="">-- 无成员，请在后台添加 --</option>';
                document.getElementById('memberStatus').textContent = '无成员';
                return;
            }

            employees.forEach(emp => {
                const opt = document.createElement('option');
                opt.value = emp.id;
                opt.textContent = emp.name + ' (' + emp.id.slice(-6) + ')' + (emp.status === 1 ? ' ✅' : ' ❌');
                sel.appendChild(opt);
            });

            // 检查URL参数
            const params = new URLSearchParams(window.location.search);
            const idParam = params.get('id');

            let targetId = idParam;
            if (!targetId) {
                // 默认选第一个在职成员
                const active = employees.find(e => e.status === 1);
                if (active) targetId = active.id;
                else targetId = employees[0]?.id;
            }

            if (targetId && employees.some(e => e.id === targetId)) {
                sel.value = targetId;
                loadMember(targetId);
            } else if (employees.length > 0) {
                sel.value = employees[0].id;
                loadMember(employees[0].id);
            }
        }

        function loadMember(memberId) {
            const member = getMember(memberId);
            if (!member) {
                showToast('⚠️ 未找到该成员');
                return;
            }

            currentMemberId = memberId;
            document.getElementById('memberStatus').textContent = '当前：' + member.name;

            // 加载设计
            const design = getDesign(memberId);
            if (design && design.length > 0) {
                elements = design;
                nextId = elements.reduce((max, e) => Math.max(max, e.id), 0) + 1;
                renderElements();
                showToast('✅ 已加载 ' + member.name + ' 的设计');
            } else {
                // 没有设计，创建默认
                elements = getDefaultLayout(member);
                nextId = elements.reduce((max, e) => Math.max(max, e.id), 0) + 1;
                renderElements();
                // 自动保存
                saveDesign(memberId, elements);
                showToast('✅ 已创建 ' + member.name + ' 的默认设计');
            }
        }

        document.getElementById('memberSelector').addEventListener('change', function() {
            const id = this.value;
            if (id) {
                loadMember(id);
                // 更新URL参数
                const url = new URL(window.location);
                url.searchParams.set('id', id);
                window.history.replaceState({}, '', url);
            }
        });

        // ================================================================
        // 工具栏按钮
        // ================================================================

        document.getElementById('saveDesignBtn').addEventListener('click', function() {
            if (currentMemberId) {
                const success = saveDesign(currentMemberId, elements);
                showToast(success ? '✅ 已保存' : '❌ 保存失败');
            } else {
                showToast('⚠️ 请先选择成员');
            }
        });

        document.getElementById('previewBtn').addEventListener('click', function() {
            if (currentMemberId) {
                saveDesign(currentMemberId, elements);
                window.open(BASE_URL + '/card.html?id=' + currentMemberId, '_blank');
            } else {
                showToast('⚠️ 请先选择成员');
            }
        });

        document.getElementById('resetDesignBtn').addEventListener('click', function() {
            if (!currentMemberId) { showToast('⚠️ 请先选择成员'); return; }
            if (confirm('确定要重置 ' + currentMemberId + ' 的设计吗？')) {
                const member = getMember(currentMemberId);
                elements = getDefaultLayout(member);
                nextId = elements.reduce((max, e) => Math.max(max, e.id), 0) + 1;
                renderElements();
                saveDesign(currentMemberId, elements);
                showToast('✅ 已重置');
            }
        });

        document.getElementById('refreshBtn').addEventListener('click', function() {
            // 强制刷新数据
            localStorage.removeItem(DB_KEY);
            const employees = getEmployees();
            populateMemberSelector();
            showToast('✅ 已刷新数据，共 ' + employees.length + ' 人');
        });

        // ================================================================
        // Toast
        // ================================================================

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ================================================================
        // 启动
        // ================================================================

        console.log('🚀 名片设计器启动...');
        console.log('📌 DB_KEY:', DB_KEY);

        // 先检查localStorage中的数据
        const rawData = localStorage.getItem(DB_KEY);
        console.log('📌 localStorage原始数据:', rawData);

        populateMemberSelector();
        console.log('✅ 名片设计器已启动');
    </script>
</body>
</html>
