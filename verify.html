<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>身份核验 · 中国林业与环境促进会</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
        }
        body {
            background: #d0dcd0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }
        .container {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            padding: 30px 24px 24px;
            position: relative;
            overflow: hidden;
            border: 2px solid #81c784;
        }
        .container .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 36px;
            font-weight: 900;
            color: rgba(46, 125, 50, 0.05);
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 6px;
            width: 200%;
            text-align: center;
        }
        .container .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #2e7d32, #81c784, #c9a84c);
            border-radius: 28px 28px 0 0;
        }

        .badge {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 16px 0;
            position: relative;
            z-index: 1;
        }
        .badge.pass {
            background: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }
        .badge.fail {
            background: #ffebee;
            color: #c62828;
            border: 2px solid #e53935;
        }
        .badge.notfound {
            background: #fff3e0;
            color: #e65100;
            border: 2px solid #ff9800;
        }

        .top-logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #c8e6c9;
            padding-bottom: 12px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        .left-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .left-logo .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .left-logo .logo-text .main {
            font-size: 20px;
            font-weight: 800;
            color: #1b5e20;
            letter-spacing: 1px;
        }
        .left-logo .logo-text .sub {
            font-size: 10px;
            font-weight: 500;
            color: #2e7d32;
            letter-spacing: 0.5px;
        }
        .left-logo .logo-text .gold {
            font-size: 13px;
            font-weight: 700;
            color: #c9a84c;
            letter-spacing: 2px;
        }
        .right-logo {
            text-align: right;
        }
        .right-logo .main {
            font-size: 22px;
            font-weight: 800;
            color: #1b5e20;
            letter-spacing: 1px;
        }
        .right-logo .sub {
            font-size: 9px;
            font-weight: 400;
            color: #666;
            letter-spacing: 0.5px;
        }

        .verify-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 12px 20px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #f1f8e9, #e8f5e9);
            border-radius: 16px;
            border: 1px solid #a5d6a7;
            position: relative;
            z-index: 1;
        }
        .verify-brand .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4caf50;
            flex-shrink: 0;
            background: #fff;
        }
        .verify-brand .brand-text {
            display: flex;
            flex-direction: column;
        }
        .verify-brand .brand-text .title {
            font-size: 15px;
            font-weight: 700;
            color: #1b5e20;
        }
        .verify-brand .brand-text .sub {
            font-size: 12px;
            color: #2e7d32;
        }
        .verify-brand .brand-text .highlight {
            font-size: 11px;
            color: #c9a84c;
            font-weight: 600;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }
        .profile .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4caf50;
            background: #c8e6c9;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #2e7d32;
        }
        .profile .info {
            flex: 1;
        }
        .profile .info .name {
            font-size: 26px;
            font-weight: 700;
            color: #1b5e20;
            line-height: 1.2;
        }
        .profile .info .title {
            font-size: 16px;
            font-weight: 500;
            color: #2e7d32;
            margin-top: 2px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }
        .info-row .label {
            color: #666;
            flex-shrink: 0;
        }
        .info-row .value {
            color: #1b5e20;
            font-weight: 500;
            text-align: right;
            word-break: break-all;
        }
        .info-row .value.duty-text {
            text-align: left;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.6;
            font-weight: 400;
        }
        .info-row:last-child {
            border-bottom: none;
        }

        .verify-footer {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 2px solid #c8e6c9;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .verify-footer .org {
            font-size: 13px;
            color: #1b5e20;
            font-weight: 600;
        }
        .verify-footer .time {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .verify-footer .verify-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 16px;
            background: #e8f5e9;
            border-radius: 20px;
            font-size: 11px;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }
        .action-buttons .btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: #2e7d32;
            cursor: pointer;
            transition: 0.2s;
            min-width: 80px;
        }
        .action-buttons .btn:hover {
            background: #1b5e20;
        }
        .action-buttons .btn.outline {
            background: transparent;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }
        .action-buttons .btn.outline:hover {
            background: #2e7d32;
            color: #fff;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1b5e20;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
        }

        .env-hint {
            font-size: 10px;
            color: #ccc;
            text-align: center;
            margin-top: 6px;
        }

        @media (max-width: 440px) {
            .container {
                padding: 20px 16px;
            }
            .profile .avatar {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            .profile .info .name {
                font-size: 22px;
            }
            .badge {
                font-size: 16px;
                padding: 6px 18px;
            }
            .left-logo .logo-text .main {
                font-size: 16px;
            }
            .left-logo .logo-text .gold {
                font-size: 11px;
            }
            .right-logo .main {
                font-size: 18px;
            }
            .info-row {
                font-size: 13px;
                padding: 6px 0;
            }
            .action-buttons .btn {
                font-size: 13px;
                padding: 8px 0;
            }
            .verify-brand {
                padding: 10px 14px;
                gap: 10px;
            }
            .verify-brand .brand-logo {
                width: 44px;
                height: 44px;
            }
            .verify-brand .brand-text .title {
                font-size: 13px;
            }
            .verify-brand .brand-text .sub {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div id="container" class="container">
        <div class="watermark">中国林业与环境促进会</div>
        <div class="top-bar"></div>
        <div id="content"></div>
        <div class="env-hint" id="envHint">🌐 当前环境：<span id="envLabel">加载中...</span></div>
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script>
        // ================================================================
        // 配置
        // ================================================================

        const DB_KEY = 'emp_system_data';
        const MEMBERS_URL = 'https://zghspj.github.io/qjgwh/members.json';

        function getBaseUrl() {
            const host = window.location.host;
            const pathname = window.location.pathname;
            const origin = window.location.origin;

            if (host.includes('127.0.0.1') || host.includes('localhost') || host.includes('192.168.')) {
                return origin + pathname.replace(/\/[^/]*$/, '');
            }

            if (host.includes('github.io')) {
                const parts = pathname.split('/').filter(p => p !== '');
                if (parts.length > 0) {
                    return origin + '/' + parts[0];
                }
                return origin;
            }

            return origin + pathname.replace(/\/[^/]*$/, '');
        }

        const BASE_URL = getBaseUrl();
        const isLocal = window.location.host.includes('127.0.0.1') || window.location.host.includes('localhost');

        document.getElementById('envLabel').textContent = isLocal ? '本地开发' : '线上部署';
        console.log('🌐 BASE_URL:', BASE_URL);

        // ================================================================
        // 从 GitHub 加载数据
        // ================================================================

        async function loadMembers() {
            try {
                const response = await fetch(MEMBERS_URL, {
                    cache: 'no-cache',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    localStorage.setItem(DB_KEY, JSON.stringify(data));
                    return data;
                }
                throw new Error('数据为空');
            } catch (e) {
                console.warn('⚠️ 从 GitHub 加载失败:', e.message);
                const stored = localStorage.getItem(DB_KEY);
                if (stored) {
                    try {
                        const data = JSON.parse(stored);
                        if (data && data.length > 0) return data;
                    } catch (e2) {}
                }
                return null;
            }
        }

        function getMember(id, employees) {
            return employees.find(e => e.id === id) || null;
        }

        // ================================================================
        // 渲染核验页面
        // ================================================================

        async function renderPage() {
            const content = document.getElementById('content');
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');

            // 加载数据
            const employees = await loadMembers();
            if (!employees || employees.length === 0) {
                content.innerHTML = `
                    <div style="text-align:center;padding:40px 0;">
                        <div style="font-size:48px;margin-bottom:12px;">👥</div>
                        <div style="font-size:18px;font-weight:600;color:#1b5e20;">暂无人员信息</div>
                        <p style="color:#888;font-size:14px;margin-top:8px;">请先在管理后台添加成员</p>
                    </div>
                `;
                return;
            }

            if (!id) {
                const active = employees.find(e => e.status === 1);
                if (active) {
                    // 直接跳转，使用完整的 URL
                    window.location.href = BASE_URL + '/verify.html?id=' + active.id;
                    return;
                }
                content.innerHTML = `
                    <div style="text-align:center;padding:40px 0;">
                        <div style="font-size:48px;margin-bottom:12px;">👥</div>
                        <div style="font-size:18px;font-weight:600;color:#1b5e20;">暂无在职人员</div>
                    </div>
                `;
                return;
            }

            const member = getMember(id, employees);
            if (!member) {
                content.innerHTML = `
                    <div style="text-align:center;padding:30px 0;">
                        <div class="badge notfound">🔍 查无此人</div>
                        <p style="color:#888;font-size:14px;margin-top:8px;">编号 ${id} 不存在</p>
                        <div style="margin-top:16px;">
                            <a href="${BASE_URL}/admin.html" style="color:#2e7d32;font-weight:600;text-decoration:none;border-bottom:2px solid #4caf50;padding-bottom:2px;">前往管理后台 →</a>
                        </div>
                    </div>
                    <div class="verify-footer">
                        <div class="org">中国林业与环境促进会 · 青少年儿童生态健康发展工作委员会</div>
                        <div class="time">核验时间：${new Date().toLocaleString('zh-CN')}</div>
                    </div>
                `;
                return;
            }

            const isActive = member.status === 1;
            const badgeHtml = isActive ?
                `<div class="badge pass">✅ 核验通过 · 在职</div>` :
                `<div class="badge fail">❌ 已离职</div>`;

            let avatarHtml = '';
            if (member.avatar && member.avatar.startsWith('data:image')) {
                avatarHtml = `<img src="${member.avatar}" class="avatar" alt="头像">`;
            } else {
                avatarHtml = `<div class="avatar">${member.name.charAt(0)}</div>`;
            }

            const verifyBrandHtml = `
                <div class="verify-brand">
                    <img src="${BASE_URL}/ccpef-yhdc.png" class="brand-logo" alt="委员会Logo" 
                         onerror="this.style.display='none'; this.parentElement.querySelector('.brand-fallback').style.display='flex';">
                    <div class="brand-fallback" style="display:none;width:52px;height:52px;border-radius:50%;background:#2e7d32;color:#fff;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0;border:2px solid #4caf50;">🌳</div>
                    <div class="brand-text">
                        <span class="title">中国林业与环境促进会</span>
                        <span class="sub">青少年儿童生态健康发展工作委员会</span>
                        <span class="highlight">🔒 官方身份核验</span>
                    </div>
                </div>
            `;

            // ★★★ 修复：使用完整的 BASE_URL 生成名片链接 ★★★
            const cardUrl = BASE_URL + '/card.html?id=' + member.id;

            content.innerHTML = `
                <div class="top-logos">
                    <div class="left-logo">
                        <div class="logo-text">
                            <span class="main">CCPEF</span>
                            <span class="sub">YOUTH ECOLOGICAL HEALTH COMMITTEE</span>
                            <span class="gold">青健工委会</span>
                        </div>
                    </div>
                    <div class="right-logo">
                        <div class="main">CCPEF.</div>
                        <div class="sub">CCPEF-YHDC</div>
                    </div>
                </div>

                ${verifyBrandHtml}
                ${badgeHtml}

                <div class="profile">
                    ${avatarHtml}
                    <div class="info">
                        <div class="name">${member.name}</div>
                        <div class="title">${member.title || '无职务'}</div>
                    </div>
                </div>

                <div class="info-row">
                    <span class="label">编号</span>
                    <span class="value">${member.id}</span>
                </div>
                <div class="info-row">
                    <span class="label">职务</span>
                    <span class="value">${member.title || '—'}</span>
                </div>
                <div class="info-row">
                    <span class="label">职责</span>
                    <span class="value duty-text">${member.duty || '未设置'}</span>
                </div>
                ${member.phone ? `<div class="info-row"><span class="label">电话</span><span class="value">${member.phone}</span></div>` : ''}
                ${member.email ? `<div class="info-row"><span class="label">邮箱</span><span class="value">${member.email}</span></div>` : ''}
                ${member.address ? `<div class="info-row"><span class="label">地址</span><span class="value">${member.address}</span></div>` : ''}
                <div class="info-row" style="border-bottom:none;">
                    <span class="label">在岗状态</span>
                    <span class="value" style="color:${isActive ? '#2e7d32' : '#c62828'};">
                        ${isActive ? '✅ 在职' : '❌ 离职'}
                    </span>
                </div>

                <div class="action-buttons">
                    <button class="btn outline" id="backBtn">🔙 返回</button>
                    <button class="btn" id="viewCardBtn">👁️ 查看名片</button>
                </div>

                <div class="verify-footer">
                    <div class="org">中国林业与环境促进会 · 青少年儿童生态健康发展工作委员会</div>
                    <div class="time">核验时间：${new Date().toLocaleString('zh-CN')}</div>
                    <div class="verify-badge">🔒 官方核验 · 信息真实有效</div>
                </div>
            `;

            // ================================================================
            // ★★★ 修复：按钮使用完整的 URL ★★★
            // ================================================================

            document.getElementById('backBtn').addEventListener('click', function() {
                window.history.back();
            });

            document.getElementById('viewCardBtn').addEventListener('click', function() {
                // ★★★ 使用完整的 URL，不依赖 JavaScript 的 history ★★★
                window.open(cardUrl, '_blank');
            });
        }

        // ================================================================
        // Toast
        // ================================================================

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ================================================================
        // 启动
        // ================================================================

        renderPage();
        window.addEventListener('popstate', renderPage);
        console.log('✅ 核验页面已启动');
        console.log('📌 名片链接:', BASE_URL + '/card.html?id=xxx');
    </script>
</body>
</html>
